name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Stage static site
        run: |
          mkdir -p public/downloads
          cp index.html styles.css app.js zip.js parser.js exporter.js robots.txt sitemap.xml CNAME LICENSE .nojekyll public/
          cp downloads/power-bi-inspector-offline.html downloads/power-bi-inspector-offline.zip downloads/README.md public/downloads/
      - uses: actions/configure-pages@v6
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
